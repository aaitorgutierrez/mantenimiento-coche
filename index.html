<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peugeot 208 · taller</title>
<meta name="theme-color" content="#d3d9df">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/":"./vendor/addons/"}}</script>
</head>
<body class="home">
<header class="top">
  <a class="brand" href="./" aria-label="Inicio">
    <span class="num">208</span>
    <span class="brand-txt"><strong>Peugeot 208 Style</strong><small>1.2 PureTech 82 CV · 2016</small></span>
  </a>
  <nav class="nav" aria-label="Principal">
    <a href="./" aria-current="page">Coche</a>
    <a href="mantenimiento.html">Registros</a>
    <button type="button" id="btn-ajustes">Ajustes</button>
  </nav>
</header>

<main class="stage">
  <canvas id="gl" aria-label="Modelo 3D del coche"></canvas>
  <div id="pins" aria-live="polite"></div>
  <p class="hint" id="hint">Gira el coche con el dedo o el ratón. Elige una zona abajo o toca una pieza.</p>
</main>

<aside id="panel" class="panel" hidden aria-live="polite"></aside>
<nav class="rail" id="rail" aria-label="Zonas del coche"></nav>

<dialog id="dlg-ajustes">
  <form method="dialog">
    <h2>Ajustes</h2>
    <label>Dirección del PDF del manual
      <input id="aj-url" type="url" placeholder="https://…/manual.pdf">
      <small>Opcional. Si la pones, cada referencia tendrá un botón «Abrir» que salta a la página. Si no, usa «Copiar» y busca esa página en tu PDF.</small>
    </label>
    <label>Color de la carrocería
      <input id="aj-color" type="color" value="#9aa5b1">
    </label>
    <p class="credito">Modelo 3D «Peugeot 208 2017» de <a href="https://sketchfab.com/3d-models/peugeot-208-2017-b2ae9e143690430e9483f1190ae8ce6c" target="_blank" rel="noopener">luizantonix</a> (Sketchfab), licencia <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="noopener">CC BY-NC-SA 4.0</a>. Texturas reducidas y modelo adaptado a esta web.</p>
    <menu>
      <button id="aj-cerrar" class="btn sec">Cancelar</button>
      <button id="aj-guardar" class="btn">Guardar ajustes</button>
    </menu>
  </form>
</dialog>

<noscript><p class="noscript">Esta página necesita JavaScript.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
